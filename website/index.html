<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stickit</title>
  <meta name="description" content="Sticky notes for your Android home screen." />
  <meta property="og:title" content="Stickit" />
  <meta property="og:description" content="Sticky notes for your Android home screen." />
  <meta property="og:image" content="img/quran.jpg" />
  <link rel="icon" href="img/logo.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #09080c;
      color: #f2eff7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    a { color: inherit; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 88px 24px 64px;
    }

    .logo { width: 72px; height: 72px; }

    h1 {
      margin-top: 22px;
      font-size: clamp(40px, 7vw, 64px);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    p.line {
      margin-top: 14px;
      font-size: 18px;
      color: #8d879b;
    }

    .btn {
      margin-top: 32px;
      display: inline-block;
      padding: 14px 26px;
      border-radius: 999px;
      background: #f2eff7;
      color: #09080c;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: background .15s, transform .15s;
    }
    .btn:hover { background: #fff; transform: translateY(-1px); }

    .meta {
      margin-top: 12px;
      font-size: 13px;
      color: #5f5a6b;
    }

    .shots {
      margin-top: 72px;
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .shots img {
      width: 200px;
      height: auto;
      border-radius: 18px;
      display: block;
    }

    footer {
      padding: 28px 24px 36px;
      font-size: 13px;
      color: #5f5a6b;
    }
    footer a { color: #8d879b; text-decoration: none; }
    footer a:hover { color: #f2eff7; }
    footer .dot { margin: 0 10px; }

    @media (max-width: 680px) {
      main { padding-top: 64px; }
      .shots { gap: 10px; }
      .shots img { width: 30vw; border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="img/logo.png" alt="Stickit" />
    <h1>Stickit</h1>
    <p class="line">Sticky notes for your home screen.</p>

    <a class="btn" href="stickit.apk" download>Download for Android</a>
    <p class="meta">16 MB &middot; Free</p>

    <div class="shots">
      <img src="img/bible.jpg" width="480" height="938" alt="Bible verse note on a home screen" />
      <img src="img/quran.jpg" width="480" height="938" alt="Quran verse note on a home screen" />
      <img src="img/quotes.jpg" width="480" height="938" alt="Quote notes on a home screen" />
    </div>
  </main>

  <footer>
    Done by <a href="https://israelashenafi.com" target="_blank" rel="noopener">israelashenafi.com</a>
    <span class="dot">&middot;</span>
    <a href="https://t.me/Atomic_izzy" target="_blank" rel="noopener">Telegram</a>
  </footer>
</body>
</html>
